observed_catalog_state:
  products: 0
  note: >-
    The commerce protocol is live but the store it fronts is empty. /products.json
    and /collections/all/products.json both return {"products":[]}, and the sitemap
    index carries page, collection and blog sitemaps but no product sitemap. An agent
    calling search_catalog on this merchant will find nothing to buy; the storefront
    directs purchase to Amazon and physical retail.
  checked: '2026-09-07'
