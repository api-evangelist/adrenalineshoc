apis:
- aid: adrenalineshoc:adrenalineshoc-ucp-commerce-mcp
  name: Accelerator Active Energy UCP Commerce MCP API
  description: An anonymous Model Context Protocol endpoint implementing the Universal Commerce Protocol
    (UCP) shopping service on the Accelerator Active Energy storefront host. tools/list returns thirteen
    tools with full JSON Schema input contracts covering catalog search and lookup, product detail, cart
    lifecycle, checkout lifecycle and order retrieval. tools/call is gated on the caller supplying a resolvable
    UCP agent profile URI, and checkout completion requires contemporaneous human buyer approval per the
    store's published agent policy.
  humanURL: https://www.drinkaccelerator.com/agents.md
  baseURL: https://www.drinkaccelerator.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Commerce
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/adrenalineshoc-mcp.yml
  - type: ToolCrosswalk
    url: mcp/adrenalineshoc-tool-crosswalk.yml
- aid: adrenalineshoc:adrenalineshoc-storefront-graphql
  name: Accelerator Active Energy Storefront GraphQL API
  description: The Shopify Storefront GraphQL API as deployed on the Accelerator Active Energy domain.
    Anonymous full introspection is open and returns 428 types, 34 query root fields and 41 mutations
    covering products, collections, blogs, pages, search, cart, customer accounts and Shop Pay payment
    request sessions. Dated versions are selected in the URL path; 2026-07, 2026-04, 2025-01 and 2024-04
    all answer.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://www.drinkaccelerator.com/api/2026-07/graphql.json
  tags:
  - GraphQL
  - Commerce
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/adrenalineshoc-storefront.graphql
- aid: adrenalineshoc:adrenalineshoc-storefront-json
  name: Accelerator Active Energy Storefront JSON Endpoints
  description: The read-only JSON surface the store's own agent instructions document for agents that
    only need to browse catalog data without transacting - product JSON by handle, collection product
    listings, and product search. No authentication is required. Observed empty at profiling time - /products.json
    returns {"products":[]}.
  humanURL: https://www.drinkaccelerator.com/agents.md
  baseURL: https://www.drinkaccelerator.com/
  tags:
  - JSON
  - Catalog
  - Read Only
  properties:
  - type: Documentation
    url: https://www.drinkaccelerator.com/agents.md
