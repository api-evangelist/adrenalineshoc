aid: adrenalineshoc
name: Adrenaline Shoc
description: 'Adrenaline Shoc (A SHOC) is the performance energy drink brand of A Shoc Beverage, LLC,
  trading today as Accelerator Active Energy and headquartered in Newport Beach, California. Founded in
  2019 by beverage entrepreneur Lance Collins, the company sells zero-sugar 16oz energy drinks built on
  a plant-based caffeine blend of green coffee bean, yerba mate, coffee fruit extract and guarana with
  electrolytes and amino acids, distributed nationally through Keurig Dr Pepper and sold in roughly 80,000
  US retail doors. It is not a software company and publishes no developer program, OpenAPI, SDK or API
  reference. Its entire public machine-readable surface is its direct-to-consumer storefront at drinkaccelerator.com
  (ashoc.com redirects there): a Shopify-hosted store that serves agent instructions at /agents.md and
  /llms.txt, a Universal Commerce Protocol merchant profile at /.well-known/ucp, an anonymous Model Context
  Protocol endpoint exposing thirteen catalog, cart, checkout and order tools, and an openly introspectable
  Storefront GraphQL API. The storefront catalog itself is currently empty — /products.json returns zero
  products and the sitemap index carries no product sitemap — so the commerce protocol is live over a
  store that sells nothing online; purchase is directed to Amazon and physical retail.'
