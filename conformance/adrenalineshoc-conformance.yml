- id: iso4217-minor-units
  name: ISO 4217 currency minor units
  conforms: true
  evidence: Every price-bearing tool description states that amounts are integers in
    the currency's ISO 4217 minor units paired with a currency code.
- id: iso3166-1-alpha2
  name: ISO 3166-1 alpha-2 country codes
  conforms: true
