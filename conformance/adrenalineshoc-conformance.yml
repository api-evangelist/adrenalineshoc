standards:
- id: ucp-shopping
  name: Universal Commerce Protocol - dev.ucp.shopping
  conforms: true
  version: '2026-08-25'
  evidence: /.well-known/ucp returns a merchant profile declaring service dev.ucp.shopping
    at version 2026-08-25 (with 2026-04-08 and 2026-01-23 also served), transport mcp,
    and capabilities checkout, fulfillment, discount, cart, order, catalog.search,
    catalog.lookup and dev.shopify.catalog.
  spec: https://ucp.dev/2026-08-25/specification/overview/
  domain_standard: true
  market: agentic retail commerce
  note: >-
    This is the domain standard for this company's market. A buyer whose agent already
    speaks UCP can search, cart and check out against this merchant with no bespoke
    connector; the store declares its version train, its capability set and its payment
    handlers in a single machine-readable profile at a registered well-known path.
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: POST /api/ucp/mcp with a JSON-RPC 2.0 tools/list request returned HTTP 200
    and a result.tools array of 13 tools, each carrying a JSON Schema inputSchema.
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: The MCP endpoint accepts and answers jsonrpc "2.0" envelopes, including
    error objects with code/message/data.
- id: oidc-discovery
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: /.well-known/openid-configuration returns issuer, authorization_endpoint,
    token_endpoint, jwks_uri, response_types_supported, subject_types_supported and
    id_token_signing_alg_values_supported.
- id: rfc8414-oauth-metadata
  name: RFC 8414 OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: /.well-known/oauth-authorization-server returns 200 with the required metadata
    fields; byte-identical to the OIDC document.
- id: oauth2-pkce
  name: RFC 7636 PKCE
  conforms: true
  evidence: code_challenge_methods_supported is ["S256"].
- id: rfc7523-jwt-bearer
  name: RFC 7523 JWT Bearer grant
  conforms: true
  evidence: grant_types_supported includes urn:ietf:params:oauth:grant-type:jwt-bearer.
- id: graphql
  name: GraphQL (Shopify Storefront API)
  conforms: true
  evidence: Anonymous full introspection returned a valid __schema with 428 types, 34
    query root fields and 41 mutations at /api/2026-07/graphql.json.
- id: google-pay-api
