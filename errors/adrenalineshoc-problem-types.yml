problems:
- id: ucp-invalid-profile-url
  surface: mcp
  jsonrpc_code: -32001
  http_status: 422
  message: UCP discovery failed
  data_code: invalid_profile_url
  detail: 'Unable to fetch agent profile: Missing profile uri'
  continue_url: https://a-shoc.myshopify.com/
  observed: true
  remediation: >-
    Supply meta.ucp-agent.profile as a resolvable URI pointing at your published agent
    profile on every call. This gate fires before argument validation and before method
    dispatch - a tools/call with an empty arguments object, and a call to a method that
    does not exist, both return this same error.
  significance: >-
    tools/list is anonymous and open, but tools/call is effectively gated on the caller
    publishing a fetchable agent profile. This is the store's agent-identity control,
    and it is the only error an unregistered agent will ever see.
